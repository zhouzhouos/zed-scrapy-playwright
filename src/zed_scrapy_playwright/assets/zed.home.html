<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>Pages Config</title>
        <style data-name="基础格式">
            playwright,
            browser,
            context,
            page {
                display: block;
                min-height: 30px;
                margin: 30px 10px 10px 10px; /*TB-LR T-LR-B TRBL*/
                border: green solid 1px;
                position: relative;
            }
            playwright::before,
            browser::before,
            context::before,
            page::before {
                position: absolute;
                top: -20px; /* 稍微调整，对齐得更准 */
                left: 0;
                color: slategray;
                /*background-color: white;*/
            }
            playwright::before {
                content: "playwright";
            }
            browser::before {
                content: "browser";
            }
            context::before {
                content: "context";
            }
            page::before {
                content: "page";
            }
        </style>
        <style></style>
    </head>

        <!---->
        <main>replace</main>
        <!---->
    </body>
</html>
